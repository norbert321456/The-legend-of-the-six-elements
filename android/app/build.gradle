plugins {
    id 'com.android.application'
}

/*  A jatek forrasa (game.html + assets/) a repo gyokereben marad – nem duplikaljuk.
    Build elott ide masoljuk: app/build/generated/webassets/www/  ->  APK: assets/www/  */
def webAssetsDir = new File(layout.buildDirectory.get().asFile, "generated/webassets")

tasks.register('copyWebAssets', Copy) {
    description = 'A game.html es az assets/ mappa bemasolasa az APK-ba'
    from(rootProject.file("..")) {
        include 'game.html'
        include 'assets/**'
    }
    into new File(webAssetsDir, "www")
}

android {
    namespace 'hu.legendofthesixelements.game'
    compileSdk 34

    defaultConfig {
        applicationId "hu.legendofthesixelements.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.2.0"
    }

    sourceSets {
        main {
            assets.srcDirs += [webAssetsDir]
        }
    }

    buildTypes {
        debug {
            // sideload APK: nincs kodzsugoritas, gyors build
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// A Gradle 8 hibat dob, ha egy task olyan konyvtarat olvas, amit egy masik task
// allit elo, es nincs kozottuk kimondott fuggoseg. Ezert mindkettot bekotjuk.
tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }
     .configureEach { dependsOn 'copyWebAssets' }

dependencies {
    /*  A Kotlin 1.8 ota a kotlin-stdlib-jdk7/jdk8 osztalyai beolvadtak a fo
        kotlin-stdlib-be. Ha egy fuggoseg a regi (1.6.21) jdk7/jdk8 modult hozza,
        egy masik pedig az uj stdlib-et, a build "Duplicate class" hibaval elszall.
        A BOM egy verziora igazitja mindharmat.  */
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
