name: Android APK keszitese

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Forras letoltese
        uses: actions/checkout@v4

      - name: Java 17 beallitasa
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK beallitasa
        uses: android-actions/setup-android@v3

      - name: SDK csomagok telepitese
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle beallitasa
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK buildelese
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      # Hiba eseten a Gradle kimenete bekerul a job osszefoglalojaba es
      # annotaciokent is, hogy bejelentkezes nelkul is lathato legyen.
      - name: Hiba reszletei
        if: failure()
        run: |
          if [ ! -f gradle-build.log ]; then echo "::error::Nincs gradle-build.log"; exit 0; fi
          echo '### Gradle hiba' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 150 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          MSG=$(grep -n -A 10 -m 4 -E "FAILURE:|What went wrong|error:|ERROR:|Caused by:" gradle-build.log | head -c 3000 || true)
          if [ -z "$MSG" ]; then MSG=$(tail -n 40 gradle-build.log); fi
          MSG="${MSG//'%'/'%25'}"
          MSG="${MSG//$'\n'/'%0A'}"
          MSG="${MSG//$'\r'/'%0D'}"
          echo "::error::$MSG"

      - name: Build log feltoltese
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: APK atnevezese
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/The-Legend-of-the-Six-Elements.apk"
          ls -lh out/

      - name: APK feltoltese (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: The-Legend-of-the-Six-Elements-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Csatolas a kiadasokhoz (csak v* tag eseten)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*.apk
